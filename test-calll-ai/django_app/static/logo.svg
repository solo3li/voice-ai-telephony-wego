<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#5b21b6" />
    </linearGradient>
    <linearGradient id="whiteSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7c3aed" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Clean Rounded Square with Violet Gradient -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="url(#headerGrad)" filter="url(#shadow3)" />

  <!-- Gloss Top Highlight -->
  <path d="M 36 136 C 36 80, 80 36, 136 36 L 376 36 C 432 36, 476 80, 476 136 C 476 150, 400 170, 256 170 C 112 170, 36 150, 36 136 Z" fill="#ffffff" opacity="0.12" />

  <!-- Modern Speech + Frequency Waveform Integrated Geometry -->
  <!-- Outer Speech Bubble / AI Portal curve -->
  <path d="M 256 120 C 180 120, 120 175, 120 245 C 120 288, 145 325, 185 348 L 170 400 L 230 368 C 238 370, 247 370, 256 370 C 332 370, 392 315, 392 245 C 392 175, 332 120, 256 120 Z" fill="#4c1d95" opacity="0.6" />

  <!-- Crisp Modern Equalizer Soundwaves with Rounded Caps -->
  <g fill="url(#whiteSilver)">
    <!-- Bar 1 -->
    <rect x="180" y="225" width="16" height="40" rx="8" />
    <!-- Bar 2 -->
    <rect x="212" y="195" width="16" height="100" rx="8" />
    <!-- Bar 3 (Center tall) -->
    <rect x="244" y="165" width="18" height="160" rx="9" />
    <!-- Bar 4 -->
    <rect x="278" y="190" width="16" height="110" rx="8" />
    <!-- Bar 5 -->
    <rect x="310" y="225" width="16" height="40" rx="8" />
  </g>

  <!-- Smart AI Spark in top-right of bubble -->
  <path d="M 360 160 Q 360 180, 380 180 Q 360 180, 360 200 Q 360 180, 340 180 Q 360 180, 360 160 Z" fill="#ffffff" opacity="0.95" />
</svg>