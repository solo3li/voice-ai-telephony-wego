{% load static %}
<script>
  if (typeof window.toggleLangDropdown !== 'function') {
    window.toggleLangDropdown = function(menuId) {
      var menu = document.getElementById(menuId);
      if (!menu) return;
      var isCurrentlyHidden = menu.classList.contains('hidden');
      document.querySelectorAll('[id$="-lang-menu"]').forEach(function(m) { m.classList.add('hidden'); });
      if (isCurrentlyHidden) {
        menu.classList.remove('hidden');
      }
    };
  }
  if (typeof window.selectAppLanguage !== 'function') {
    window.selectAppLanguage = function(lang) {
      if (typeof window.applyCommonLanguage === 'function') {
        window.applyCommonLanguage(lang);
      } else {
        try {
          localStorage.setItem('app_lang', lang);
          localStorage.setItem('voice_app_lang', lang);
        } catch(e) {}
        try {
          var cookieExp = 'max-age=31536000;path=/;SameSite=Lax';
          document.cookie = 'app_lang=' + encodeURIComponent(lang) + ';' + cookieExp;
          document.cookie = 'voice_app_lang=' + encodeURIComponent(lang) + ';' + cookieExp;
          document.cookie = 'django_language=' + encodeURIComponent(lang) + ';' + cookieExp;
        } catch(e) {}
        var url = new URL(window.location.href);
        url.searchParams.set('locale', lang);
        window.location.href = url.toString();
      }
      document.querySelectorAll('[id$="-lang-menu"]').forEach(function(m) { m.classList.add('hidden'); });
    };
  }
</script>

  <script>
    (function() {
      function syncSidebarLangLabels() {
        var savedLang = localStorage.getItem('app_lang') || localStorage.getItem('voice_app_lang') || 'ar';
        var langLabels = { 'ar': 'عربي', 'en': 'EN', 'tr': 'TR', 'fr': 'FR', 'de': 'DE', 'es': 'ES' };
        var label = langLabels[savedLang] || (savedLang ? savedLang.toUpperCase() : 'AR');
        var topText = document.getElementById('sidebar-top-lang-text');
        if (topText) {
          topText.textContent = label;
        }
        var bottomText = document.getElementById('sidebar-bottom-lang-text');
        if (bottomText) {
          bottomText.textContent = label;
        }
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', syncSidebarLangLabels);
      } else {
        syncSidebarLangLabels();
      }
      window.addEventListener('appLanguageChanged', function() {
        syncSidebarLangLabels();
      });
    })();
  </script>
