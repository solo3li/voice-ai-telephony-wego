{% load static %}
<!-- ==================== Chatwoot-Engineered Clean Sidebar (Dedicated Omnichannel & Admin) ==================== -->
<aside id="sidebar" class="bg-white text-slate-700 flex flex-col justify-between transition-all duration-300 z-30 shadow-xs shrink-0 sidebar-expanded border-l md:border-l-0 md:border-e border-[#eaedf0] md:sticky md:top-0 md:h-screen md:max-h-screen overflow-hidden">
  
  <!-- Top Brand & Toggle (Pinned) -->
  <div class="h-14 px-3.5 flex items-center justify-between border-b border-[#eaedf0] shrink-0 bg-white">
    <a href="{% url 'voice_assistant:room' %}" class="flex items-center gap-2.5 overflow-hidden cursor-pointer group">
      <div class="w-8 h-8 rounded-lg bg-[#1f93ff] text-white shadow-xs flex items-center justify-center shrink-0">
        <!-- Lucide Sparkle/Mic SVG -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" x2="12" y1="19" y2="22"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1 class="text-xs font-bold text-slate-900 tracking-tight" data-i18n="app_title">المساعد الصوتي الذكي</h1>
        <p class="text-[10px] text-slate-400 font-mono" data-i18n="app_subtitle">Enterprise Voice AI</p>
      </div>
    </a>
    
    <!-- Toggle Collapse Button -->
    <button type="button" onclick="toggleSidebar()" class="text-slate-400 hover:text-slate-700 p-1 rounded-md hover:bg-slate-100 transition" title="طي/توسيع القائمة">
      <svg id="sidebar-toggle-icon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
      </svg>
    </button>
  </div>

  <!-- Navigation Links: ONLY 4 Dedicated Items -->
  <nav id="sidebar-nav-container" class="flex-1 overflow-y-auto overflow-x-hidden px-2 py-2 space-y-1 text-xs custom-sidebar-scroll min-h-0">
    
    <!-- Group 1: قنوات المحادثات والرسائل -->
    <div class="px-2 pt-2 pb-1 text-[10px] font-bold text-slate-400 uppercase tracking-wider">
      قنوات المحادثة
    </div>

    <!-- 1. Chatwoot Omnichannel Chat -->
    <a href="{% url 'voice_assistant:chat_page' %}" id="nav-btn-chat" class="nav-item group w-full flex items-center justify-between gap-2 px-2.5 py-2.5 rounded-lg transition text-start {% if active_nav == 'chat' %}bg-[#eff8ff] text-[#1f93ff] font-bold border border-[#b2ddff]/60 shadow-2xs{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100/70 font-medium{% endif %}">
      <div class="flex items-center gap-2.5 truncate">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0 {% if active_nav == 'chat' %}text-[#1f93ff]{% else %}text-slate-400 group-hover:text-slate-700{% endif %}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span class="nav-text">شات (Chatwoot Hub)</span>
      </div>
      <span class="px-1.5 py-0.5 text-[9px] font-mono font-semibold rounded bg-[#eff8ff] text-[#1f93ff] border border-[#b2ddff]">Omni</span>
    </a>

    <!-- Group 2: الحساب والاشتراك والمطورين -->
    <div class="px-2 pt-4 pb-1 text-[10px] font-bold text-slate-400 uppercase tracking-wider">
      إدارة الحساب والنظام
    </div>

    <!-- 2. Billing & Wallet -->
    <a href="{% url 'voice_assistant:billing_page' %}" id="nav-btn-billing" class="nav-item group w-full flex items-center gap-2.5 px-2.5 py-2.5 rounded-lg transition text-start {% if active_nav == 'billing' %}bg-[#eff8ff] text-[#1f93ff] font-bold border border-[#b2ddff]/60 shadow-2xs{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100/70 font-medium{% endif %}">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0 {% if active_nav == 'billing' %}text-[#1f93ff]{% else %}text-slate-400 group-hover:text-slate-700{% endif %}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/>
      </svg>
      <span class="nav-text" data-i18n="nav_billing">الرصيد والفواتير</span>
    </a>

    <!-- 3. Developer API -->
    <a href="{% url 'voice_assistant:developer_page' %}" id="nav-btn-developer" class="nav-item group w-full flex items-center justify-between gap-2 px-2.5 py-2.5 rounded-lg transition text-start {% if active_nav == 'developer' %}bg-[#eff8ff] text-[#1f93ff] font-bold border border-[#b2ddff]/60 shadow-2xs{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100/70 font-medium{% endif %}">
      <div class="flex items-center gap-2.5 truncate">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0 {% if active_nav == 'developer' %}text-[#1f93ff]{% else %}text-slate-400 group-hover:text-slate-700{% endif %}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
        </svg>
        <span class="nav-text" data-i18n="nav_developer">واجهات المطورين (API)</span>
      </div>
      <span class="px-1.5 py-0.5 text-[9px] font-mono font-semibold rounded bg-emerald-50 text-emerald-700 border border-emerald-200">REST</span>
    </a>

    <!-- 4. Partner & SaaS -->
    <a href="{% url 'voice_assistant:partner_page' %}" id="nav-btn-partner" class="nav-item group w-full flex items-center gap-2.5 px-2.5 py-2.5 rounded-lg transition text-start {% if active_nav == 'partner' %}bg-[#eff8ff] text-[#1f93ff] font-bold border border-[#b2ddff]/60 shadow-2xs{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100/70 font-medium{% endif %}">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0 {% if active_nav == 'partner' %}text-[#1f93ff]{% else %}text-slate-400 group-hover:text-slate-700{% endif %}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="20" height="14" x="2" y="7" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
      </svg>
      <span class="nav-text" data-i18n="nav_partner">الشريك والـ SaaS</span>
    </a>

  </nav>

  <!-- Sidebar Bottom Profile (Chatwoot Style) -->
  <div class="p-2.5 border-t border-[#eaedf0] space-y-1.5 shrink-0 bg-slate-50/50">
    <div class="flex items-center justify-between px-2 py-1.5 rounded-lg bg-white border border-slate-200/80 shadow-2xs">
      <div class="flex items-center gap-2 overflow-hidden">
        <div class="w-7 h-7 rounded-full bg-[#eff8ff] text-[#1f93ff] border border-[#b2ddff] font-bold flex items-center justify-center text-[11px] shrink-0">
          {{ request.user.username|slice:":2"|upper }}
        </div>
        <div class="brand-text overflow-hidden text-xs leading-tight">
          <p class="font-bold text-slate-900 truncate">{{ request.user.username }}</p>
          <span class="text-[10px] text-slate-400 block" data-i18n="role_admin">مدير النظام</span>
        </div>
      </div>
      <a href="{% url 'voice_assistant:logout' %}" class="text-slate-400 hover:text-red-600 p-1 rounded-md hover:bg-red-50 transition" title="تسجيل الخروج">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>
        </svg>
      </a>
    </div>
  </div>
</aside>
