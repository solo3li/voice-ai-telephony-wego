{% load static %}
<!-- ==================== Minimalist Sidebar (5 Dedicated Core Portals) ==================== -->
<aside id="sidebar" class="bg-white text-slate-700 flex flex-col justify-between transition-all duration-200 z-30 shrink-0 border-b md:border-b-0 md:border-e border-[#eaedf0] md:sticky md:top-0 md:h-screen md:max-h-screen overflow-hidden">
  
  <style>
    /* Minimalist text-only sidebar dimensions */
    #sidebar {
      width: 15rem;
    }
    #sidebar.sidebar-collapsed,
    #sidebar.sidebar-expanded {
      width: 15rem;
    }
    #sidebar.sidebar-collapsed .brand-text,
    #sidebar.sidebar-collapsed .nav-text {
      display: block !important;
    }
  </style>

  <!-- Top Brand (Pinned) -->
  <div class="h-14 px-4 flex items-center justify-between border-b border-[#eaedf0] shrink-0 bg-white">
    <a href="{% url 'voice_assistant:room' %}" class="flex items-center gap-2.5 overflow-hidden cursor-pointer group">
      <div class="w-7 h-7 rounded-lg bg-[#1f93ff] text-white flex items-center justify-center shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" x2="12" y1="19" y2="22"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1 class="text-xs font-semibold text-slate-900 tracking-tight" data-i18n="app_title">المساعد الصوتي الذكي</h1>
        <p class="text-[10px] text-slate-400 font-mono" data-i18n="app_subtitle">Enterprise Voice AI</p>
      </div>
    </a>
    <!-- Hidden element to preserve JS compatibility if queried -->
    <span id="sidebar-toggle-icon" class="hidden"></span>
  </div>

  <!-- Navigation Links: Exactly 5 Dedicated Text-Only Portals -->
  <nav id="sidebar-nav-container" class="flex-1 overflow-y-auto overflow-x-hidden px-2.5 py-3 space-y-1 text-xs custom-sidebar-scroll min-h-0">
    
    <!-- 1. Voice & Telephony Suite Portal -->
    <a href="{% url 'voice_assistant:room' %}" id="nav-btn-telephony-portal" class="nav-item block w-full px-3 py-2 rounded-lg transition text-start {% if active_nav in 'voice,calls,rag,personas,crm,store,campaigns,callcenter,telephony,business_hours' or not active_nav %}bg-[#eff8ff] text-[#1f93ff] font-semibold{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-50 font-normal{% endif %}">
      <span class="nav-text">المساعد الصوتي والاتصالات</span>
    </a>

    <!-- 2. Chatwoot Omnichannel Chat -->
    <a href="{% url 'voice_assistant:chat_page' %}" id="nav-btn-chat" class="nav-item block w-full px-3 py-2 rounded-lg transition text-start {% if active_nav == 'chat' %}bg-[#eff8ff] text-[#1f93ff] font-semibold{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-50 font-normal{% endif %}">
      <span class="nav-text">شات (Chatwoot Hub)</span>
    </a>

    <!-- 3. Billing & Wallet -->
    <a href="{% url 'voice_assistant:billing_page' %}" id="nav-btn-billing" class="nav-item block w-full px-3 py-2 rounded-lg transition text-start {% if active_nav == 'billing' %}bg-[#eff8ff] text-[#1f93ff] font-semibold{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-50 font-normal{% endif %}">
      <span class="nav-text" data-i18n="nav_billing">الرصيد والفواتير</span>
    </a>

    <!-- 4. Developer API -->
    <a href="{% url 'voice_assistant:developer_page' %}" id="nav-btn-developer" class="nav-item block w-full px-3 py-2 rounded-lg transition text-start {% if active_nav == 'developer' %}bg-[#eff8ff] text-[#1f93ff] font-semibold{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-50 font-normal{% endif %}">
      <span class="nav-text" data-i18n="nav_developer">واجهات المطورين (API)</span>
    </a>

    <!-- 5. Partner & SaaS -->
    <a href="{% url 'voice_assistant:partner_page' %}" id="nav-btn-partner" class="nav-item block w-full px-3 py-2 rounded-lg transition text-start {% if active_nav == 'partner' %}bg-[#eff8ff] text-[#1f93ff] font-semibold{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-50 font-normal{% endif %}">
      <span class="nav-text" data-i18n="nav_partner">الشريك والـ SaaS</span>
    </a>

  </nav>

  <!-- Bottom User Profile (Minimalist & Quiet) -->
  <div class="p-3 border-t border-[#eaedf0] shrink-0 bg-white">
    <div class="flex items-center justify-between gap-2 px-1">
      <div class="flex items-center gap-2.5 overflow-hidden">
        <div class="w-7 h-7 rounded-full bg-slate-100 text-slate-700 font-semibold flex items-center justify-center text-[11px] shrink-0">
          {{ request.user.username|slice:":2"|upper }}
        </div>
        <div class="brand-text overflow-hidden text-xs leading-tight">
          <p class="font-medium text-slate-800 truncate">{{ request.user.username }}</p>
          <span class="text-[10px] text-slate-400" data-i18n="role_admin">مدير النظام</span>
        </div>
      </div>
      <a href="{% url 'voice_assistant:logout' %}" class="text-slate-400 hover:text-red-600 p-1.5 rounded-md hover:bg-red-50/50 transition" title="تسجيل الخروج">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>
        </svg>
      </a>
    </div>
  </div>
</aside>
