{% load static %}
<!DOCTYPE html>
<html lang="{{ locale|default:'ar' }}" dir="{% if locale == 'en' %}ltr{% else %}rtl{% endif %}" class="w-full h-full m-0 p-0 overflow-hidden">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page_title|default:"منصة المحادثات المضمنة" }}</title>
  
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- Compiled Static Tailwind CSS & Self-Hosted Fonts -->
  <link rel="stylesheet" href="{% static 'css/tailwind.min.css' %}">
  
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
      font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f8fafc;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #7c3aed;
    }
  </style>
</head>
<body class="w-full h-full relative bg-white text-slate-800 antialiased overflow-hidden select-none selection:bg-[#7c3aed] selection:text-white">

  <!-- White-Label Seamless Embed Loader -->
  <div id="embed-chat-loader" class="absolute inset-0 bg-white/95 backdrop-blur-xs flex flex-col items-center justify-center gap-3.5 z-50 transition-opacity duration-300">
    <div class="w-9 h-9 border-[3px] border-[#7c3aed]/20 border-t-[#7c3aed] rounded-full animate-spin"></div>
    <div class="text-center">
      <p class="text-xs font-semibold text-slate-800">جاري تحميل منصة المحادثات...</p>
      <p class="text-xs text-slate-400 mt-0.5 font-light">اتصال مباشر آمن بالذكاء الاصطناعي</p>
    </div>
  </div>

  <!-- Fullscreen Chatwoot Iframe -->
  <iframe 
    id="embed-chatwoot-frame"
    loading="lazy"
    src="{{ chatwoot_url }}"
    class="w-full h-full border-0 block m-0 p-0"
    allow="camera *; microphone *; clipboard-read *; clipboard-write *; display-capture *; fullscreen *; keyboard-map *"
    onload="onEmbedFrameLoaded()"
  ></iframe>

  <script>
    let embedDismissed = false;

    function dismissEmbedLoader() {
      if (embedDismissed) return;
      embedDismissed = true;
      const loader = document.getElementById('embed-chat-loader');
      if (loader) {
        loader.classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => { loader.style.display = 'none'; }, 350);
      }
      const frame = document.getElementById('embed-chatwoot-frame');
      if (frame && frame.contentWindow) {
        try {
          frame.contentWindow.postMessage({ type: 'set_theme', theme: 'light' }, '*');
        } catch(e) {}
      }
    }

    function onEmbedFrameLoaded() {
      // Safety fallback timer if SSO postMessage is delayed
      setTimeout(() => {
        dismissEmbedLoader();
      }, 2800);
    }

    window.addEventListener('message', function(event) {
      if (!event.data) return;
      if (event.data.type === 'chatwoot:ready' || event.data.event === 'chatwoot:ready') {
        dismissEmbedLoader();
        if (window.parent && window.parent !== window) {
          try {
            window.parent.postMessage({ type: 'CHAT_READY', timestamp: new Date().toISOString() }, '*');
          } catch(e) {}
        }
      }
      // Forward unread count or chat messages to parent window
      if (window.parent && window.parent !== window && typeof event.data === 'object') {
        if (event.data.event === 'unread_message_count' || event.data.type === 'chatwoot:on-message') {
          try {
            window.parent.postMessage(event.data, '*');
          } catch(e) {}
        }
      }
      // Listen for commands from parent window to forward to chatwoot iframe
      if (event.data.type === 'SET_THEME' || event.data.type === 'SET_LOCALE' || event.data.type === 'TOGGLE_CHAT') {
        const frame = document.getElementById('embed-chatwoot-frame');
        if (frame && frame.contentWindow) {
          try {
            frame.contentWindow.postMessage(event.data, '*');
          } catch(e) {}
        }
      }
    });
  </script>
</body>
</html>
