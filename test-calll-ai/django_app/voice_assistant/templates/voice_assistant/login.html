{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول | المساعد الصوتي الذكي Enterprise Voice AI</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <!-- Google Fonts: Cairo (Arabic) & Inter (English) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script>
    (function(){var w=console.warn;console.warn=function(){if(arguments[0]&&typeof arguments[0]==='string'&&arguments[0].indexOf('cdn.tailwindcss.com')!==-1)return;w.apply(console,arguments);};})();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Cairo', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-4 antialiased">

  <div class="w-full max-w-sm bg-white border border-[#eaedf0] rounded-xl p-7 shadow-2xs relative z-10 transition">
    
    <!-- Header Branding -->
    <div class="text-center mb-6">
      <div class="w-10 h-10 rounded-lg bg-[#1f93ff] text-white mx-auto flex items-center justify-center mb-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" x2="12" y1="19" y2="22"/>
        </svg>
      </div>

      <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-[#eff8ff] text-[#1f93ff] text-xs font-medium mb-2.5">
        <span class="w-1.5 h-1.5 rounded-full bg-[#1f93ff]"></span>
        <span>منظومة الذكاء الاصطناعي الصوتي</span>
      </div>

      <h1 class="text-xl font-bold text-slate-900 tracking-tight">
        تسجيل الدخول
      </h1>
      <p class="text-xs text-slate-500 mt-1">
        مرحباً بك مجدداً في منصة المساعد الصوتي الفوري
      </p>
    </div>

    <!-- Error Alert Box -->
    {% if error %}
    <div class="mb-5 p-3 rounded-lg bg-red-50 border border-red-200 text-xs text-red-700 flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0 text-red-600" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
      </svg>
      <span class="font-medium">{{ error }}</span>
    </div>
    {% endif %}

    <!-- Login Form -->
    <form method="POST" action="" class="space-y-4">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.GET.next|default:'' }}" />

      <!-- Username Input -->
      <div>
        <label for="username" class="block text-xs font-medium text-slate-700 mb-1.5">اسم المستخدم</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          required 
          autocomplete="username"
          autofocus
          class="w-full px-3 py-2 rounded-lg bg-white border border-[#eaedf0] text-xs text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-[#1f93ff] focus:ring-1 focus:ring-[#1f93ff] transition"
          placeholder="أدخل اسم المستخدم الخاص بك"
        />
      </div>

      <!-- Password Input -->
      <div>
        <label for="password" class="block text-xs font-medium text-slate-700 mb-1.5">كلمة المرور</label>
        <div class="relative">
          <input 
            type="password" 
            id="password" 
            name="password" 
            required 
            autocomplete="current-password"
            class="w-full px-3 py-2 pe-10 rounded-lg bg-white border border-[#eaedf0] text-xs text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-[#1f93ff] focus:ring-1 focus:ring-[#1f93ff] transition"
            placeholder="••••••••"
          />
          <button 
            type="button" 
            onclick="togglePasswordVisibility('password', this)" 
            class="absolute end-2 top-1/2 -translate-y-1/2 p-1 text-slate-400 hover:text-slate-700 transition focus:outline-none"
            title="إظهار / إخفاء كلمة المرور"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="w-full py-2.5 px-4 rounded-lg font-medium bg-[#1f93ff] hover:bg-[#1570ef] text-white text-xs transition duration-150 flex items-center justify-center gap-2 cursor-pointer shadow-2xs mt-2"
      >
        <span>تسجيل الدخول</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 rtl:rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </button>
    </form>

    <!-- Bottom Switcher to Register -->
    <div class="mt-6 pt-4 border-t border-[#eaedf0] text-center text-xs text-slate-500">
      ليس لديك حساب بعد؟
      <a href="{% url 'voice_assistant:register' %}" class="text-[#1f93ff] hover:text-[#1570ef] font-medium mr-1 transition">
        أنشئ حساباً جديداً
      </a>
    </div>

  </div>

  <script>
    function togglePasswordVisibility(fieldId, btn) {
      const input = document.getElementById(fieldId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-[#1f93ff]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
          </svg>
        `;
      } else {
        input.type = 'password';
        btn.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
        `;
      }
    }
  </script>
</body>
</html>
