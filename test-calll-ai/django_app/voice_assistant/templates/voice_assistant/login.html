{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function() {
      var savedLang = localStorage.getItem('app_lang') || localStorage.getItem('voice_app_lang') || 'ar';
      document.documentElement.lang = savedLang;
      document.documentElement.dir = (savedLang === 'ar') ? 'rtl' : 'ltr';
    })();
  </script>
  <title data-i18n="login_page_title">تسجيل الدخول | المساعد الصوتي الذكي Enterprise Voice AI</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <!-- Compiled Static Tailwind CSS & Self-Hosted Fonts -->
  <link rel="stylesheet" href="{% static 'css/tailwind.min.css' %}">

  <style>
    html, body {
      font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f8fafc;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #7c3aed;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-[#7c3aed] selection:text-white">

  <div class="w-full max-w-sm bg-white border border-slate-200/80 rounded-xl p-7 shadow-2xs relative z-10 transition">
    
    <!-- Top Lang Switcher: 6-Language Dropdown Selector Component -->
    <div class="flex justify-end mb-2">
      <div class="relative inline-block text-start" id="login-lang-dropdown-wrapper">
        <button type="button" onclick="toggleLangDropdown('login-lang-menu')" id="lang-switch-btn" class="px-2.5 py-1 rounded-full bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 text-xs font-semibold transition flex items-center gap-1.5 shadow-2xs cursor-pointer" aria-haspopup="true" aria-expanded="false" title="Language / تغيير اللغة">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-slate-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>
          </svg>
          <span id="lang-text" class="text-xs font-medium">العربية</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 text-slate-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
        <div id="login-lang-menu" class="hidden absolute end-0 mt-1.5 w-40 bg-white rounded-xl shadow-lg border border-slate-100 py-1 z-50 transition-all">
          <button type="button" onclick="selectAppLanguage('ar')" data-lang-option="ar" class="w-full flex items-center justify-between px-3 py-1.5 text-xs text-slate-700 hover:bg-violet-50 hover:text-[#7c3aed] transition cursor-pointer">
            <span class="flex items-center gap-2"><span>🇸🇦</span><span>العربية</span></span>
            <span class="lang-check text-[#7c3aed] font-bold text-xs">✓</span>
          </button>
          <button type="button" onclick="selectAppLanguage('en')" data-lang-option="en" class="w-full flex items-center justify-between px-3 py-1.5 text-xs text-slate-700 hover:bg-violet-50 hover:text-[#7c3aed] transition cursor-pointer">
            <span class="flex items-center gap-2"><span>🇬🇧</span><span>English</span></span>
            <span class="lang-check text-[#7c3aed] font-bold text-xs hidden">✓</span>
          </button>
          <button type="button" onclick="selectAppLanguage('tr')" data-lang-option="tr" class="w-full flex items-center justify-between px-3 py-1.5 text-xs text-slate-700 hover:bg-violet-50 hover:text-[#7c3aed] transition cursor-pointer">
            <span class="flex items-center gap-2"><span>🇹🇷</span><span>Türkçe</span></span>
            <span class="lang-check text-[#7c3aed] font-bold text-xs hidden">✓</span>
          </button>
          <button type="button" onclick="selectAppLanguage('fr')" data-lang-option="fr" class="w-full flex items-center justify-between px-3 py-1.5 text-xs text-slate-700 hover:bg-violet-50 hover:text-[#7c3aed] transition cursor-pointer">
            <span class="flex items-center gap-2"><span>🇫🇷</span><span>Français</span></span>
            <span class="lang-check text-[#7c3aed] font-bold text-xs hidden">✓</span>
          </button>
          <button type="button" onclick="selectAppLanguage('de')" data-lang-option="de" class="w-full flex items-center justify-between px-3 py-1.5 text-xs text-slate-700 hover:bg-violet-50 hover:text-[#7c3aed] transition cursor-pointer">
            <span class="flex items-center gap-2"><span>🇩🇪</span><span>Deutsch</span></span>
            <span class="lang-check text-[#7c3aed] font-bold text-xs hidden">✓</span>
          </button>
          <button type="button" onclick="selectAppLanguage('es')" data-lang-option="es" class="w-full flex items-center justify-between px-3 py-1.5 text-xs text-slate-700 hover:bg-violet-50 hover:text-[#7c3aed] transition cursor-pointer">
            <span class="flex items-center gap-2"><span>🇪🇸</span><span>Español</span></span>
            <span class="lang-check text-[#7c3aed] font-bold text-xs hidden">✓</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Header Branding -->
    <div class="text-center mb-6">
      <img src="{% static 'logo.svg' %}" alt="Logo" class="w-10 h-10 rounded-lg mx-auto mb-3 shadow-xs" />

      <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-[#f5f3ff] text-[#7c3aed] text-xs font-medium mb-2.5">
        <span class="w-1.5 h-1.5 rounded-full bg-[#7c3aed]"></span>
        <span data-i18n="login_badge">منظومة الذكاء الاصطناعي الصوتي</span>
      </div>

      <h1 class="text-xl font-bold text-slate-900 tracking-tight" data-i18n="login_title">
        تسجيل الدخول
      </h1>
      <p class="text-xs text-slate-500 mt-1" data-i18n="login_subtitle">
        مرحباً بك مجدداً في منصة المساعد الصوتي الفوري
      </p>
    </div>

    <!-- Error Alert Box -->
    {% if error %}
    <div class="mb-5 p-3 rounded-lg bg-red-50 border border-red-200 text-xs text-red-700 flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0 text-red-600" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
      </svg>
      <span class="font-medium">{{ error }}</span>
    </div>
    {% endif %}

    <!-- Login Form -->
    <form method="POST" action="" class="space-y-4">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.GET.next|default:'' }}" />

      <!-- Username Input -->
      <div>
        <label for="username" class="block text-xs font-medium text-slate-700 mb-1.5" data-i18n="login_username_label">اسم المستخدم</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          required 
          autocomplete="username"
          autofocus
          class="w-full px-3 py-2 rounded-lg bg-white border border-slate-200/80 text-xs text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-[#7c3aed] focus:ring-1 focus:ring-[#7c3aed] transition"
          placeholder="أدخل اسم المستخدم الخاص بك"
          data-i18n-placeholder="login_username_placeholder"
        />
      </div>

      <!-- Password Input -->
      <div>
        <label for="password" class="block text-xs font-medium text-slate-700 mb-1.5" data-i18n="login_password_label">كلمة المرور</label>
        <div class="relative">
          <input 
            type="password" 
            id="password" 
            name="password" 
            required 
            autocomplete="current-password"
            class="w-full px-3 py-2 pe-10 rounded-lg bg-white border border-slate-200/80 text-xs text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-[#7c3aed] focus:ring-1 focus:ring-[#7c3aed] transition"
            placeholder="••••••••"
            data-i18n-placeholder="login_password_placeholder"
          />
          <button 
            type="button" 
            onclick="togglePasswordVisibility('password', this)" 
            class="absolute end-2 top-1/2 -translate-y-1/2 p-1 text-slate-400 hover:text-slate-700 transition focus:outline-none"
            title="إظهار / إخفاء كلمة المرور"
            data-i18n-title="show_hide_password"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="w-full py-2.5 px-4 rounded-lg font-semibold bg-[#7c3aed] hover:bg-[#6d28d9] text-white text-xs transition duration-150 flex items-center justify-center gap-2 cursor-pointer shadow-2xs mt-2"
      >
        <span data-i18n="login_btn_submit">تسجيل الدخول</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 rtl:rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </button>
    </form>

    <!-- Bottom Switcher to Register -->
    <div class="mt-6 pt-4 border-t border-slate-200/80 text-center text-xs text-slate-500">
      <span data-i18n="login_no_account">ليس لديك حساب بعد؟</span>
      <a href="{% url 'voice_assistant:register' %}" class="text-[#7c3aed] hover:text-[#6d28d9] font-medium mr-1 transition" data-i18n="login_create_account">
        أنشئ حساباً جديداً
      </a>
    </div>

  </div>

  <script src="{% static 'js/common.js' %}"></script>
  <script>
    function togglePasswordVisibility(fieldId, btn) {
      const input = document.getElementById(fieldId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-[#7c3aed]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
          </svg>
        `;
      } else {
        input.type = 'password';
        btn.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
        `;
      }
    }
  </script>
</body>
</html>
