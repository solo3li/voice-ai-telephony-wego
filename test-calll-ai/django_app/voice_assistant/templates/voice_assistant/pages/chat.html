{% extends 'voice_assistant/base.html' %}
{% load static %}

{% block title %}شات - منصة المحادثات الشاملة{% endblock %}

{% block content %}
<style>
  /* Full-bleed seamless container for Chatwoot: hide app header & use full viewport */
  header {
    display: none !important;
  }
  #main-wrapper {
    background-color: #ffffff !important;
    overflow: hidden !important;
  }
  main {
    max-width: 100% !important;
    padding: 0 !important;
    margin: 0 !important;
    height: 100vh !important;
    max-height: 100vh !important;
    overflow: hidden !important;
  }
</style>

<div class="relative w-full h-screen bg-white overflow-hidden">
  <!-- Loading Spinner Overlay -->
  <div id="chat-frame-loader" class="absolute inset-0 bg-[#f8fafc]/95 backdrop-blur-xs flex flex-col items-center justify-center gap-3 z-10 transition-opacity duration-300">
    <div class="w-8 h-8 border-2 border-[#1f93ff]/20 border-t-[#1f93ff] rounded-full animate-spin"></div>
    <p class="text-xs font-medium text-slate-500 font-sans" data-i18n="chat_loading">جاري تحميل منصة المحادثات...</p>
  </div>

  <!-- Embedded Chatwoot Iframe -->
  <iframe 
    id="chatwoot-frame"
    src="{{ chatwoot_url|default:'https://chatwoot.169.58.32.179.nip.io/app/accounts/2' }}"
    class="w-full h-full border-0 block"
    allow="camera *; microphone *; clipboard-read *; clipboard-write *; display-capture *; fullscreen *; keyboard-map *"
    onload="onChatFrameLoaded()"
  ></iframe>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  function onChatFrameLoaded() {
    const loader = document.getElementById('chat-frame-loader');
    if (loader) {
      loader.classList.add('opacity-0', 'pointer-events-none');
      setTimeout(() => loader.style.display = 'none', 300);
    }
  }
</script>
{% endblock %}
