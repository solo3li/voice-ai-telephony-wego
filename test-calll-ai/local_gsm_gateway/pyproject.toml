[project]
name = "dongle_gateway"
version = "1.0.0"
description = "GSM USB Dongle AI Voice Gateway"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet==1.0.2",
    "requests>=2.31.0",
    "pyserial>=3.5",
]

[tool.flet]
org = "com.aivoice"
product = "DongleGateway"
company = "Voice AI Platform"
copyright = "Copyright (c) 2026 Voice AI Platform"

[tool.flet.app]
path = "."

[tool.flet.android]
permissions = [
    "INTERNET",
    "ACCESS_NETWORK_STATE",
    "RECORD_AUDIO",
    "MODIFY_AUDIO_SETTINGS",
]
