global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'django_telephony'
    metrics_path: '/api/telephony/metrics/'
    static_configs:
      - targets: ['django:8000']

  - job_name: 'livekit'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['livekit:6789']
