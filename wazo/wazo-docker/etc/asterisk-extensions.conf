[globals](+)
WAZO_AGID_IP = agid
LIVEKIT_SIP_ENDPOINT = voice_sip:5060
XIVO_PRESUBR_GLOBAL_ENABLE = 1
XIVO_PRESUBR_GLOBAL_USER = custom-user-presubr
XIVO_PRESUBR_GLOBAL_QUEUE = custom-queue-presubr

[add-livekit-headers]
exten => s,1,NoOp(Pre-dial: Adding LiveKit SIP headers - Context: ${WAZO_CALLER_CONTEXT} - Ext: ${WAZO_CALLER_EXTEN})
same => n,Set(PJSIP_HEADER(add,X-Wazo-Tenant-Context)=${WAZO_CALLER_CONTEXT})
same => n,Set(PJSIP_HEADER(add,X-Wazo-Caller-Ext)=${WAZO_CALLER_EXTEN})
same => n,Return()

[custom-hangup-handler]
exten => s,1,NoOp(Hangup Handler triggered - Channel=${CHANNEL} UniqueID=${UNIQUEID} Caller=${CDR_CALLER} Callee=${CDR_CALLEE})
same => n,Set(CDR_BILLSEC=${IF($["${ANSWEREDTIME}" != ""]?${ANSWEREDTIME}:0)})
same => n,Set(CDR_DURATION=${IF($["${DIALEDTIME}" != ""]?${DIALEDTIME}:0)})
same => n,Set(CDR_STATUS=${IF($["${DIALSTATUS}" != ""]?${DIALSTATUS}:ANSWERED)})
same => n,Set(EFF_CALLER=${IF($["${CDR_CALLER}" != ""]?${CDR_CALLER}:${IF($["${CALLERID(num)}" != ""]?${CALLERID(num)}:unknown)})})
same => n,Set(EFF_CALLEE=${IF($["${CDR_CALLEE}" != ""]?${CDR_CALLEE}:${IF($["${EXTEN}" != ""]?${EXTEN}:unknown)})})
same => n,Set(EFF_CONTEXT=${IF($["${CDR_CONTEXT}" != ""]?${CDR_CONTEXT}:${CONTEXT})})
same => n,Set(EFF_REC=${IF($["${CDR_RECORDING_FILE}" != ""]?${CDR_RECORDING_FILE}:/media/recordings/${UNIQUEID}.wav)})
same => n,Set(CURLOPT(conntimeout)=2)
same => n,Set(CURLOPT(httptimeout)=3)
same => n,Set(CURL_DATA=caller=${URIENCODE(${EFF_CALLER})}&callee=${URIENCODE(${EFF_CALLEE})}&duration=${CDR_BILLSEC}&total_duration=${CDR_DURATION}&status=${URIENCODE(${CDR_STATUS})}&uniqueid=${URIENCODE(${UNIQUEID})}&recording=${URIENCODE(${EFF_REC})}&context=${URIENCODE(${EFF_CONTEXT})})
same => n,NoOp(Posting Hangup CDR to Django: ${CURL_DATA})
same => n,Set(CURL_RES=${CURL(http://django:8000/api/call-center/internal/asterisk-cdr/,${CURL_DATA})})
same => n,NoOp(Django CDR response: ${CURL_RES})
same => n,Return()

[custom-user-presubr]
exten => s,1,NoOp(User Presubroutine: Caller=${CALLERID(num)} Callee=${WAZO_DSTNUM} Channel=${CHANNEL})
same => n,GotoIf($["${CDR_TRACKED}" = "1"]?already_tracked_u)
same => n,Set(__CDR_TRACKED=1)
same => n,Set(__CDR_CALLER=${IF($["${CALLERID(num)}" != ""]?${CALLERID(num)}:${WAZO_CALLER_NUM})})
same => n,Set(__CDR_CALLEE=${IF($["${WAZO_DSTNUM}" != ""]?${WAZO_DSTNUM}:${EXTEN})})
same => n,Set(__CDR_CONTEXT=${IF($["${WAZO_CALLER_CONTEXT}" != ""]?${WAZO_CALLER_CONTEXT}:${CONTEXT})})
same => n,Set(__CDR_RECORDING_FILE=/media/recordings/${UNIQUEID}.wav)
same => n,Set(CHANNEL(hangup_handler_push)=custom-hangup-handler,s,1)
same => n,MixMonitor(recordings/${UNIQUEID}.wav,b)
same => n(already_tracked_u),Return()

[custom-queue-presubr]
exten => s,1,NoOp(Queue Presubroutine: Caller=${CALLERID(num)} Queue=${WAZO_QUEUENAME})
same => n,GotoIf($["${CDR_TRACKED}" = "1"]?already_tracked_q)
same => n,Set(__CDR_TRACKED=1)
same => n,Set(__CDR_CALLER=${IF($["${CALLERID(num)}" != ""]?${CALLERID(num)}:${WAZO_SRCNUM})})
same => n,Set(__CDR_CALLEE=${IF($["${WAZO_QUEUENAME}" != ""]?${WAZO_QUEUENAME}:${EXTEN})})
same => n,Set(__CDR_CONTEXT=${IF($["${WAZO_CONTEXT}" != ""]?${WAZO_CONTEXT}:${CONTEXT})})
same => n,Set(__CDR_RECORDING_FILE=/media/recordings/${UNIQUEID}.wav)
same => n,Set(CHANNEL(hangup_handler_push)=custom-hangup-handler,s,1)
same => n,MixMonitor(recordings/${UNIQUEID}.wav,b)
same => n(already_tracked_q),Return()

[xivo-extrafeatures](+)
; Route extension 999 to LiveKit Voice AI Agent with Tenant Context and Caller Ext injected in PJSIP Headers
exten => 999,1,NoOp(Forwarding to LiveKit Voice AI Agent from Context: ${WAZO_BASE_CONTEXT} / ${CONTEXT} - Ext: ${CALLERID(num)})
same => n,Ringing()
same => n,Set(__WAZO_CALLER_CONTEXT=${IF($["${WAZO_BASE_CONTEXT}" != ""]?${WAZO_BASE_CONTEXT}:${IF($["${TRANSFER_CONTEXT}" != ""]?${TRANSFER_CONTEXT}:${CONTEXT})})})
same => n,Set(__WAZO_CALLER_EXTEN=${IF($["${CALLERID(num)}" != ""]?${CALLERID(num)}:${CHANNEL(endpoint)})})
same => n,Dial(PJSIP/livekit-ai/sip:999@${LIVEKIT_SIP_ENDPOINT},60,rb(add-livekit-headers^s^1))
same => n,Hangup()

; Queue ingress and referral landing
exten => _[2-8]XX,1,NoOp(Landing in Wazo Queue ${EXTEN})
same => n,GotoIf($["${CDR_TRACKED}" = "1"]?queue_call)
same => n,Set(__CDR_TRACKED=1)
same => n,Set(__CDR_CALLER=${CALLERID(num)})
same => n,Set(__CDR_CALLEE=${EXTEN})
same => n,Set(__CDR_CONTEXT=${CONTEXT})
same => n,Set(__CDR_RECORDING_FILE=/media/recordings/${UNIQUEID}.wav)
same => n,Set(CHANNEL(hangup_handler_push)=custom-hangup-handler,s,1)
same => n,MixMonitor(recordings/${UNIQUEID}.wav,b)
same => n(queue_call),Answer()
same => n,Queue(queue_${EXTEN},,,,300)
same => n,Hangup()

[default]
include => xivo-extrafeatures
; Fallback for default context
exten => 999,1,NoOp(Forwarding to LiveKit Voice AI Agent from Default: ${WAZO_BASE_CONTEXT} / ${CONTEXT})
same => n,Ringing()
same => n,Set(__WAZO_CALLER_CONTEXT=${IF($["${WAZO_BASE_CONTEXT}" != ""]?${WAZO_BASE_CONTEXT}:${IF($["${TRANSFER_CONTEXT}" != ""]?${TRANSFER_CONTEXT}:${CONTEXT})})})
same => n,Set(__WAZO_CALLER_EXTEN=${IF($["${CALLERID(num)}" != ""]?${CALLERID(num)}:${CHANNEL(endpoint)})})
same => n,Dial(PJSIP/livekit-ai/sip:999@${LIVEKIT_SIP_ENDPOINT},60,rb(add-livekit-headers^s^1))
same => n,Hangup()
