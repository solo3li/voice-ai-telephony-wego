[globals](+)
WAZO_AGID_IP = agid
LIVEKIT_SIP_ENDPOINT = 169.58.32.179:5060

[globals](+)
WAZO_AGID_IP = agid
LIVEKIT_SIP_ENDPOINT = 169.58.32.179:5060

[xivo-extrafeatures](+)
; Route extension 999 to LiveKit Voice AI Agent with Tenant Context and Caller Ext injected in PJSIP Headers
exten => 999,1,NoOp(Forwarding to LiveKit Voice AI Agent from Context: ${CONTEXT} - Ext: ${CALLERID(num)})
same => n,Set(PJSIP_HEADER(add,X-Wazo-Tenant-Context)=${CONTEXT})
same => n,Set(PJSIP_HEADER(add,X-Wazo-Caller-Ext)=${CALLERID(num)})
same => n,Dial(PJSIP/sip:ai@${LIVEKIT_SIP_ENDPOINT},60)
same => n,Hangup()

; Queue ingress and referral landing
exten => _2XX,1,NoOp(Landing in Wazo Queue ${EXTEN})
same => n,Answer()
same => n,Queue(queue_${EXTEN},,,,300)
same => n,Hangup()

exten => _3XX,1,NoOp(Landing in Wazo Queue ${EXTEN})
same => n,Answer()
same => n,Queue(queue_${EXTEN},,,,300)
same => n,Hangup()

[default](+)
; Fallback for default context
exten => 999,1,NoOp(Forwarding to LiveKit Voice AI Agent from Default)
same => n,Set(PJSIP_HEADER(add,X-Wazo-Tenant-Context)=${CONTEXT})
same => n,Set(PJSIP_HEADER(add,X-Wazo-Caller-Ext)=${CALLERID(num)})
same => n,Dial(PJSIP/sip:ai@${LIVEKIT_SIP_ENDPOINT},60)
same => n,Hangup()

