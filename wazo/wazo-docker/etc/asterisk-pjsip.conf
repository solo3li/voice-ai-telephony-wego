[global](+)
endpoint_identifier_order=username,ip,anonymous

[livekit-ai]
type=endpoint
context=livekit-inbound
transport=transport-udp
allow=!all,ulaw,alaw,g722,opus
aors=livekit-ai
direct_media=no

[livekit-ai]
type=aor
contact=sip:voice_sip:5060

[livekit-ai]
type=identify
endpoint=livekit-ai
match=127.0.0.1
match_header=User-Agent: LiveKit.*

[emp101](+)
allow=!all,alaw,ulaw,g722,opus
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

